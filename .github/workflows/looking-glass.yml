---
name: Build Looking Glass artifact

on:
  push:
    branches:
      - main
    paths:
      - Containerfile.looking-glass
      - build_files/install_looking_glass.sh
      - .github/workflows/looking-glass.yml
  workflow_dispatch:

env:
  ARTIFACT_IMAGE: ghcr.io/${{ github.repository_owner }}/looking-glass-client
  ARTIFACT_TAG: b7-fedora44

concurrency:
  group: looking-glass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push Looking Glass artifact
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        run: echo "ARTIFACT_IMAGE=${ARTIFACT_IMAGE,,}" >> "${GITHUB_ENV}"

      - name: Build artifact
        run: |
          podman build \
            --pull=newer \
            --file Containerfile.looking-glass \
            --tag "${ARTIFACT_IMAGE}:${ARTIFACT_TAG}" \
            .

      - name: Verify artifact contents
        run: |
          container_id="$(podman create "${ARTIFACT_IMAGE}:${ARTIFACT_TAG}")"
          trap 'podman rm "${container_id}" >/dev/null' EXIT
          podman cp \
            "${container_id}:/usr/bin/looking-glass-client" \
            /tmp/looking-glass-client
          test -x /tmp/looking-glass-client

      - name: Push artifact
        run: |
          podman push \
            "${ARTIFACT_IMAGE}:${ARTIFACT_TAG}" \
            "${ARTIFACT_IMAGE}:${ARTIFACT_TAG}"
