# Mango workstation fallback.
# A user configuration at ~/.config/mango/config.conf takes precedence.

source=/usr/share/mightydisciple/mango/environment.conf
source=/usr/share/mightydisciple/mango/monitors.conf
source=/usr/share/mightydisciple/mango/input.conf
source=/usr/share/mightydisciple/mango/layout.conf
source=/usr/share/mightydisciple/mango/appearance.conf
source=/usr/share/mightydisciple/mango/keybindings.conf

# Noctalia owns this generated per-user palette; Mango also works without it.
source-optional=~/.config/mango/noctalia.conf
