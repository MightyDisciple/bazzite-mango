# Mango defaults for the MightyDisciple workstation.
# A user config at ~/.config/mango/config.conf overrides this fallback.

# Session integration
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto
exec-once=noctalia

# Displays translated from the active Niri configuration. Keep all coordinates
# positive because negative coordinates break pointer input in XWayland.
monitorrule=name:^DP-7$,width:3840,height:2160,refresh:120,x:0,y:0,scale:1.5,vrr:1,rr:0
monitorrule=name:^DP-8$,width:2560,height:1440,refresh:143.998,x:2560,y:0,scale:1,vrr:0,rr:0
xwayland_ignore_scale=1
exec-once=echo "Xft.dpi: 144" | xrdb -merge

# Niri-like scroller defaults
tag_num=9
gappih=16
gappiv=16
gappoh=16
gappov=16
borderpx=4
border_radius=20
no_radius_when_single=0
no_border_when_single=0
scroller_default_proportion=0.5
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.33333,0.5,0.66667
scroller_focus_center=0
sloppyfocus=1
warpcursor=0
numlockon=1
tap_to_click=1
trackpad_natural_scrolling=1
tagrule=id:*,layout_name:scroller

# Noctalia recommends keeping layer blur, layer shadows and layer animations
# disabled for its transparent surfaces. Mango may still decorate app windows.
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadowscolor=0x000000ff
animations=1
layer_animations=0

# Applications and Noctalia panels
bind=SUPER,Return,spawn,alacritty
bind=SUPER+CTRL,Return,spawn,noctalia msg panel-toggle launcher
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,b,spawn,Vivaldi
bind=SUPER,e,spawn,nautilus
bind=SUPER+ALT,l,spawn,noctalia msg session lock
bind=SUPER+SHIFT,q,spawn,noctalia msg panel-toggle session

# Media controls
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioPause,spawn,noctalia msg media toggle
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Window focus and movement
bind=SUPER,q,killclient
bind=SUPER,Left,focusdir,left
bind=SUPER,h,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,l,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,k,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusdir,down
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Right,tagmon,right

# Tags/workspaces
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0
bind=SUPER,Tab,view,-1,0
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Layout and session controls
bind=SUPER,t,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER,o,toggleoverview
bind=SUPER,r,reload_config
bind=CTRL+ALT,Delete,quit
bind=SUPER+SHIFT,p,sleep_toggle_monitor,all

# Unity's X11 utility windows and dialogs should remain independently usable.
windowrule=isfloating:1,width:900,height:700,appid:^Unityhub-unity-editor-,title:^(Project Settings|Preferences|Package Manager|Build Settings|Build Profiles|Player Settings|Lighting|Navigation|Services|Version Control)$
windowrule=isfloating:1,width:640,height:480,appid:^Unityhub-unity-editor-,title:(?i)^(open|save|select|warning|error|confirm|rename|create|import|export)(.*)$

# Let Noctalia generate and hot-reload its Mango color theme when enabled.
source-optional=~/.config/mango/noctalia.conf
