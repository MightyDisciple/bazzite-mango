# Session identity and toolkit integration
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# Session services
exec-once=noctalia

# XWayland scaling
# Render clients at native resolution; Xft-aware apps use 144 DPI for 150% UI.
xwayland_ignore_scale=1
exec-once=echo "Xft.dpi: 144" | xrdb -merge
